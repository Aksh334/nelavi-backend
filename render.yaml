services:
  - type: web
    name: nelavi-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: echo "No external dependencies required"
    startCommand: python -B -m demo_app --remote --host 0.0.0.0 --port $PORT --allowed-hosts "${ALLOWED_HOSTS:-$RENDER_EXTERNAL_HOSTNAME}" ${CORS_ORIGINS:+--cors-origins "$CORS_ORIGINS"}
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: NELAVI_AUTH_TOKEN
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ORIGINS
        sync: false
